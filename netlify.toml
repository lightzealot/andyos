[build]
  base = "."
  command = "echo 'Sitio estático: sin build'"
  publish = "web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
