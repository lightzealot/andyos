<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d0f">
<meta name="robots" content="noindex">
<title>Panel de contenido</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="login" hidden>
  <form id="login-form" class="login">
    <h1>Panel de contenido</h1>
    <label>Correo
      <input id="login-email" type="email" required autocomplete="username" value="hello@andresgomez.store">
    </label>
    <label>Contraseña
      <input id="login-pass" type="password" autocomplete="current-password">
    </label>
    <button class="btn primary" type="submit">Entrar</button>
    <button class="btn ghost" type="button" id="login-link">Enviar enlace al correo</button>
    <p id="login-msg" class="muted" role="status"></p>
  </form>
</main>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="brand-name">Panel</span></div>
    <nav id="tabs" class="nav" aria-label="Vistas">
      <button data-view="semana" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semana</button>
      <button data-view="todas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Todas</button>
      <button data-view="funciono"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Funcionaron</button>
    </nav>
    <button id="logout" class="nav-out"><span class="lg">Cerrar sesión</span><span class="sm">Salir</span></button>
  </aside>

  <div class="main">
    <header class="topbar">
      <form id="capture" class="capture">
        <input id="capture-input" placeholder="Anota una idea y pulsa Enter…" maxlength="300" autocomplete="off" aria-label="Nueva idea">
        <button class="btn primary" type="submit">Añadir</button>
      </form>
    </header>

    <div class="panel">
      <div class="phead">
        <h1 id="title">Semana</h1>
        <div class="weeknav" id="weeknav">
          <button id="prev" class="icon" aria-label="Semana anterior">‹</button>
          <strong id="weeklabel"></strong>
          <button id="next" class="icon" aria-label="Semana siguiente">›</button>
          <button id="today" class="btn small">Hoy</button>
        </div>
      </div>

      <p id="status" class="status" role="status" hidden></p>

      <section id="v-semana">
        <div class="stats">
          <div class="tile"><span>Para hoy</span><b id="st-hoy">0</b></div>
          <div class="tile"><span>Esta semana</span><b id="st-semana">0</b></div>
          <div class="tile"><span>Sin fecha</span><b id="st-sin">0</b></div>
          <div class="tile ok"><span>Funcionaron</span><b id="st-func">0</b></div>
        </div>
        <div id="hoy-wrap" class="hoy" hidden>
          <h2>Para hoy</h2>
          <div id="hoy" class="list"></div>
        </div>
        <h2>Calendario</h2>
        <div id="week" class="week"></div>
        <div class="inbox">
          <h2>Sin fecha <span id="inbox-count" class="count"></span></h2>
          <div id="inbox" class="list"></div>
        </div>
      </section>

      <section id="v-todas" hidden>
        <div class="filters"><select id="tagfilter" aria-label="Filtrar por etiqueta"><option value="">Todas las etiquetas</option></select></div>
        <div id="todas"></div>
      </section>

      <section id="v-funciono" hidden>
        <p class="muted">Piezas marcadas como «funcionó». Reutilízalas como modelo.</p>
        <div id="funciono" class="list"></div>
      </section>
    </div>
  </div>
</div>

<dialog id="dlg">
  <form id="dlg-form" method="dialog">
    <label>Título <input id="f-titulo" required maxlength="300"></label>
    <label>Notas <textarea id="f-notas" rows="6" placeholder="Hook, guion, enlaces…"></textarea></label>
    <fieldset>
      <legend>Etapa</legend>
      <div id="f-etapa" class="seg"></div>
    </fieldset>
    <div class="row2">
      <label>Fecha <input id="f-fecha" type="date"></label>
      <label>Etiquetas <input id="f-etiquetas" placeholder="separadas por coma"></label>
    </div>
    <label class="check"><input id="f-funciono" type="checkbox"> Funcionó</label>
    <div class="dlg-actions">
      <button type="button" id="f-borrar" class="btn danger">Borrar</button>
      <span class="grow"></span>
      <button type="button" id="f-cancelar" class="btn ghost">Cancelar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
