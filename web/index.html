<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<meta name="robots" content="noindex">
<title>Panel de contenido</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="login" hidden>
  <form id="login-form" class="login">
    <h1>Panel de contenido</h1>
    <p class="muted">Te enviamos un enlace al correo para entrar.</p>
    <label>Correo
      <input id="login-email" type="email" required autocomplete="email" value="hello@andresgomez.store">
    </label>
    <button class="btn primary" type="submit">Enviar enlace</button>
    <p id="login-msg" class="muted" role="status"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <h1>Panel</h1>
      <nav class="tabs" id="tabs" aria-label="Vistas">
        <button data-view="semana" class="on">Semana</button>
        <button data-view="todas">Todas</button>
        <button data-view="funciono">Funcionaron</button>
      </nav>
      <button id="logout" class="btn ghost small" title="Cerrar sesión">Salir</button>
    </div>
    <form id="capture" class="capture">
      <input id="capture-input" placeholder="Anota una idea y pulsa Enter…" maxlength="300" autocomplete="off" aria-label="Nueva idea">
      <button class="btn primary" type="submit">Añadir</button>
    </form>
  </header>

  <p id="status" class="status" role="status" hidden></p>

  <section id="v-semana">
    <div class="weeknav">
      <button id="prev" class="btn ghost small" aria-label="Semana anterior">‹</button>
      <button id="today" class="btn ghost small">Hoy</button>
      <button id="next" class="btn ghost small" aria-label="Semana siguiente">›</button>
      <strong id="weeklabel"></strong>
    </div>
    <div id="hoy-wrap" class="hoy" hidden>
      <h2>Para hoy</h2>
      <div id="hoy" class="list"></div>
    </div>
    <div id="week" class="week"></div>
    <div class="inbox">
      <h2>Sin fecha <span id="inbox-count" class="count"></span></h2>
      <div id="inbox" class="list"></div>
    </div>
  </section>

  <section id="v-todas" hidden>
    <div class="filters"><select id="tagfilter" aria-label="Filtrar por etiqueta"><option value="">Todas las etiquetas</option></select></div>
    <div id="todas"></div>
  </section>

  <section id="v-funciono" hidden>
    <p class="muted">Piezas marcadas como «funcionó». Reutilízalas como modelo.</p>
    <div id="funciono" class="list"></div>
  </section>
</div>

<dialog id="dlg">
  <form id="dlg-form" method="dialog">
    <label>Título <input id="f-titulo" required maxlength="300"></label>
    <label>Notas <textarea id="f-notas" rows="6" placeholder="Hook, guion, enlaces…"></textarea></label>
    <fieldset>
      <legend>Etapa</legend>
      <div id="f-etapa" class="seg"></div>
    </fieldset>
    <div class="row2">
      <label>Fecha <input id="f-fecha" type="date"></label>
      <label>Etiquetas <input id="f-etiquetas" placeholder="separadas por coma"></label>
    </div>
    <label class="check"><input id="f-funciono" type="checkbox"> Funcionó</label>
    <div class="dlg-actions">
      <button type="button" id="f-borrar" class="btn danger">Borrar</button>
      <span class="grow"></span>
      <button type="button" id="f-cancelar" class="btn ghost">Cancelar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
